<section id="resume" class="inner resume py-48">
  <div class="content__block block-large mx-auto mb-24">
    <h2 class="h2__title animate-in-up">Experience</h2>
  </div>

  <div class="content__block block-large">
    <div class="mb-16">
      <h3
        class="relative pb-6 mb-0 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-24 after:h-[0.2rem] after:bg-accent after:rounded-[0.1rem] animate-in-up"
      >
        Work experience
      </h3>
    </div>

    <div class="container-fluid p-0 mb-24">
      <div
        *ngFor="let item of experience()"
        class="grid grid-cols-1 md:grid-cols-12 gap-x-8 gap-y-6 py-10 md:py-12 border-b border-stroke-elements transition-all duration-medium last:border-b-0 hover:bg-base-tint hover:-mx-8 hover:px-8 hover:rounded-m hover:border-b-transparent md:hover:mx-0 md:hover:px-0 md:hover:bg-transparent animate-in-up"
      >
        <div class="md:col-span-5">
          <span
            class="font-accent text-sm md:text-[1.3rem] font-semibold text-accent block mb-3 animate-in-up"
            >{{ item.timestamp }}</span
          >
          <h5 class="mb-2 text-t-bright animate-in-up text-3xl md:text-4xl">{{ item.role }}</h5>
          <p class="text-md text-t-medium mb-0 animate-in-up">
            {{ item.contractType }} at
            <a [href]="item.companySite || '#'" class="text-link-bold" target="_blank">{{
              item.company
            }}</a> in {{ item.location }}
          </p>
        </div>
        <ul class="md:col-span-7 flex flex-col gap-4 m-0 p-0 list-none">
          <li
            class="small mb-0 leading-relaxed animate-in-up !text-xl md:!text-2xl"
            *ngFor="let duty of item.duties"
          >
            {{ duty }}
          </li>
        </ul>
      </div>
    </div>
  </div>

</section>
