<section class="py-20 px-4 max-w-5xl mx-auto">
  <h2 class="text-3xl md:text-4xl font-bold text-neutral-900 dark:text-white mb-8">Contact</h2>
  <form class="bg-white dark:bg-neutral-800 rounded-xl shadow p-8 max-w-xl mx-auto flex flex-col gap-6" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div>
      <label class="block text-neutral-700 dark:text-neutral-200 font-semibold mb-2">Name</label>
      <input type="text" formControlName="name" class="w-full px-4 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="text-red-500 text-sm mt-1">Name is required.</div>
    </div>
    <div>
      <label class="block text-neutral-700 dark:text-neutral-200 font-semibold mb-2">Email</label>
      <input type="email" formControlName="email" class="w-full px-4 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="text-red-500 text-sm mt-1">Valid email is required.</div>
    </div>
    <div>
      <label class="block text-neutral-700 dark:text-neutral-200 font-semibold mb-2">Message</label>
      <textarea formControlName="message" rows="5" class="w-full px-4 py-2 rounded-lg border border-neutral-300 dark:border-neutral-700 bg-neutral-100 dark:bg-neutral-900 text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="text-red-500 text-sm mt-1">Message is required.</div>
    </div>
    <button type="submit" [disabled]="contactForm.invalid || loading" class="w-full py-3 bg-blue-500 text-white font-semibold rounded-lg shadow hover:bg-blue-600 transition disabled:opacity-50">Send Message</button>
    <div *ngIf="success" class="text-green-500 text-center mt-2">Your message has been sent!</div>
  </form>
</section>
