<section id="portfolio" class="py-16 md:py-24 lg:py-32 xl:pt-48">
  <div class="mx-auto mb-12 md:mb-20 lg:mb-32">
    <p
      class="justify-cenhyter font-medium text-t-accent mb-6 md:mb-10 animate-in-up flex gap-2 items-center btn !text-xs md:!text-sm !py-2 md:!py-3 !px-4 md:!px-5"
    >
      <i class="fa-solid fa-star text-base md:text-xl lg:text-2xl !text-t-accent"></i>
      <span>Portfolio</span>
    </p>
    <h2 class="h2__title animate-in-up text-3xl md:text-5xl lg:text-6xl">
      Check out my featured projects
    </h2>
  </div>

  <div class="mb-12 md:mb-16 lg:mb-24">
    <div class="w-full px-0">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12 lg:gap-16">
        <figure
          *ngFor="let item of portfolioItems()"
          class="w-full cursor-pointer transition-transform duration-medium hover:-translate-y-2 grid-item animate-card-2 border border-stroke-elements rounded-m md:rounded-xl overflow-hidden bg-base-tint"
          (click)="openLightbox(item)"
        >
          <div class="relative w-full aspect-square md:aspect-[4/3]">
            <img
              [src]="item.image"
              class="w-full h-full absolute inset-0 object-cover transition-transform duration-medium hover:scale-105"
              [alt]="item.name"
            />

            <div
              class="absolute inset-x-0 bottom-0 p-3 md:p-4 lg:p-6 bg-gradient-to-t from-black/40 to-transparent text-base-tint"
            >
              <h5 class="mb-1 md:mb-2 lg:mb-3 text-lg md:text-2xl lg:text-3xl text-base-tint">
                {{ item.name }}
              </h5>
              <div class="flex flex-wrap gap-2">
                <span
                  *ngFor="let tag of item.tags"
                  class="rounded-tag text-[0.7rem] md:text-xs lg:text-lg"
                >
                  {{ tag }}
                </span>
              </div>
            </div>
          </div>
        </figure>
      </div>
    </div>
  </div>
</section>

<div
  *ngIf="selectedItem"
  class="fixed inset-0 w-screen h-screen bg-black/90 backdrop-blur-[2px] flex items-center justify-center z-[10000] p-4 md:p-8 lg:p-12"
  (click)="closeLightbox()"
  [@fadeInOut]
>
  <div
    class="relative w-full max-w-[96rem] max-h-[92vh] bg-base-tint rounded-xl md:rounded-2xl p-6 md:p-10 lg:p-12 overflow-y-auto shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <button
      class="absolute top-2 right-2 md:top-4 md:right-4 w-12 h-12 md:w-16 md:h-16 bg-black/85 border border-white/60 rounded-full text-white cursor-pointer z-20 shadow-xl transition-all duration-medium hover:bg-black hover:border-white hover:scale-110 flex items-center justify-center"
      aria-label="Close project details"
      (click)="closeLightbox()"
    >
      <span aria-hidden="true" class="block leading-none font-bold text-[2.8rem] md:text-[3.2rem]">×</span>
    </button>
    <img
      [src]="selectedItem.demo || selectedItem.image"
      [alt]="selectedItem.name"
      class="w-full h-auto rounded-md md:rounded-m mb-6 md:mb-8"
    />
    <div>
      <h3 class="mb-4 md:mb-6 text-[2.8rem] md:text-[3.4rem] lg:text-[4rem] leading-tight text-t-bright">
        {{ selectedItem.name }}
      </h3>

      <p *ngIf="selectedItem.summary" class="text-[1.5rem] md:text-[1.7rem] text-t-medium mb-4 md:mb-6">
        {{ selectedItem.summary }}
      </p>

      <div class="flex flex-wrap gap-3 mb-4 md:mb-6">
        <a
          *ngIf="selectedItem.website || $any(selectedItem).companySite"
          [href]="selectedItem.website || $any(selectedItem).companySite"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-m border border-stroke-elements bg-base text-t-bright text-[1.3rem] md:text-[1.5rem] hover:border-accent hover:text-accent transition-all duration-medium"
        >
          <i class="fa-solid fa-up-right-from-square text-[1.2rem]"></i>
          Website
        </a>
        <a
          *ngIf="selectedItem.github"
          [href]="selectedItem.github"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-m border border-stroke-elements bg-base text-t-bright text-[1.3rem] md:text-[1.5rem] hover:border-accent hover:text-accent transition-all duration-medium"
        >
          <i class="fa-brands fa-github text-[1.5rem]"></i>
          GitHub
        </a>
        <a
          *ngIf="selectedItem.design"
          [href]="selectedItem.design"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-m border border-stroke-elements bg-base text-t-bright text-[1.3rem] md:text-[1.5rem] hover:border-accent hover:text-accent transition-all duration-medium"
        >
          <i class="fa-brands fa-figma text-[1.4rem]"></i>
          Design
        </a>
      </div>

      <div class="flex flex-wrap gap-2 md:gap-3 mb-4 md:mb-6">
        <span *ngFor="let tag of selectedItem.tags" class="rounded-tag text-[1.3rem] md:text-[1.5rem]">
          {{ tag }}
        </span>
      </div>

      <div *ngIf="selectedItem.stacks?.length" class="mb-4 md:mb-6">
        <p class="text-[1.3rem] md:text-[1.4rem] uppercase tracking-[0.12em] text-t-muted mb-2">Tech Stack</p>
        <div class="flex flex-wrap gap-2 md:gap-3">
          <span *ngFor="let stack of selectedItem.stacks" class="rounded-tag text-[1.2rem] md:text-[1.4rem]">
            {{ stack }}
          </span>
        </div>
      </div>

      <p class="text-[1.6rem] md:text-[1.8rem] lg:text-[2rem] leading-relaxed text-t-medium">
        {{ selectedItem.about || selectedItem.summary }}
      </p>
    </div>
  </div>
</div>
