<div
  id="avatar"
  class="relative w-[calc(100%-3rem)] h-auto mx-auto pt-6 pb-24 z-[9] origin-top-left md:pt-12 md:pb-[7.5rem] md:w-[calc(100%-12rem)] lg:fixed lg:top-12 lg:left-12 lg:w-[300px] lg:h-[calc(100%-6rem)] lg:m-0 lg:p-0 xl:left-24 2xl:top-20 2xl:left-32 2xl:w-[400px] 2xl:h-[calc(100%-10rem)] 3xl:left-40"
>
  <div
    class="relative w-full h-full p-12 flex flex-col lg:justify-between before:content-[''] before:block before:absolute before:top-0 before:left-0 before:w-full before:h-full before:bg-base-tint before:border before:border-stroke-elements before:rounded-xl 2xl:p-20"
  >
    <div class="relative mb-12 2xl:mb-[3.6rem]">
      <div class="mb-10 2xl:mb-12 flex items-center">
        <div class="flex items-center">
          <p
            class="font-accent font-bold text-5xl leading-[1.3] m-0 text-t-bright 2xl:text-[2.6rem]"
          >
            {{ personalInfo.name }}
          </p>
        </div>
      </div>
      <div class="w-full rounded-xl overflow-hidden">
        <img
          [src]="personalInfo.avatar"
          [alt]="personalInfo.name"
          class="block w-full h-auto object-cover"
        />
      </div>
    </div>

    <div class="relative mb-12 last:mb-0 2xl:mb-[3.6rem]">
      <h6 class="mb-6 leading-[1.4]">
        <small class="block text-base font-medium text-t-muted mb-2 tracking-wider"
          >Specialization:</small
        >
        <span [innerHTML]="personalInfo.specialization" class="text-5xl"></span>
      </h6>
    </div>

    <div class="relative mb-12 last:mb-0 2xl:mb-[3.6rem]">
      <h6 class="mb-6 leading-[1.4]">
        <small class="block text-base font-medium text-t-muted mb-2 tracking-wider"
          >Based in:</small
        >
        {{ personalInfo.location }}
      </h6>
    </div>

    <div class="relative mb-12 last:mb-0 2xl:mb-[3.6rem]">
      <div>
        <ul class="list-none m-0 mb-8 md:mb-10 p-0 flex justify-between gap-1 md:gap-2">
          <li class="m-0" *ngFor="let social of socialLinks">
            <a
              class="w-[3.8rem] h-[3.8rem] md:w-[4.5rem] md:h-[4.5rem] p-0 flex items-center justify-center rounded-s text-[1.6rem] md:text-[2rem] btn"
              [href]="social.url"
              target="_blank"
            >
              <i [class]="social.icon + ' text-lg md:text-xl lg:text-2xl'" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </div>
      <div class="avatar__btnholder">
        <a class="btn btn-default btn-fullwidth btn-hover btn-hover-accent" href="#contact">
          <span class="btn-caption">Let's Work Together!</span>
        </a>
      </div>
    </div>
  </div>
</div>
